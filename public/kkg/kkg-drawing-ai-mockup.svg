<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <!-- 架空図面のイメージ図。実在の図面・物件とは無関係 -->
  <rect width="1200" height="660" fill="#f6f7f9"/>

  <text x="600" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">建築図面AI — 検出イメージ（架空図面によるモックアップ）</text>
  <text x="600" y="66" text-anchor="middle" font-size="13" fill="#6b7280">※説明用に作成した架空のイメージです。実物の図面ではありません。</text>

  <!-- ============ 左パネル: 構造伏図 ============ -->
  <g transform="translate(40,90)">
    <rect width="540" height="470" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <text x="270" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#374151">構造伏図（架空） — 柱・梁 自動検出</text>

    <g transform="translate(60,70)">
      <!-- 通り芯グリッド -->
      <g stroke="#9ca3af" stroke-width="0.8" stroke-dasharray="6 4">
        <line x1="0" y1="0" x2="0" y2="330"/>
        <line x1="140" y1="0" x2="140" y2="330"/>
        <line x1="280" y1="0" x2="280" y2="330"/>
        <line x1="420" y1="0" x2="420" y2="330"/>
        <line x1="0" y1="0" x2="420" y2="0"/>
        <line x1="0" y1="165" x2="420" y2="165"/>
        <line x1="0" y1="330" x2="420" y2="330"/>
      </g>
      <!-- 通り芯符号 -->
      <g font-size="11" fill="#6b7280" text-anchor="middle">
        <text x="0" y="-12">X1</text><text x="140" y="-12">X2</text><text x="280" y="-12">X3</text><text x="420" y="-12">X4</text>
        <text x="-18" y="4">Y1</text><text x="-18" y="169">Y2</text><text x="-18" y="334">Y3</text>
      </g>

      <!-- 梁（検出: 緑ハイライト） -->
      <g stroke="#059669" stroke-width="5" stroke-linecap="round" opacity="0.85">
        <line x1="0" y1="0" x2="420" y2="0"/>
        <line x1="0" y1="165" x2="280" y2="165"/>
        <line x1="0" y1="330" x2="420" y2="330"/>
        <line x1="0" y1="0" x2="0" y2="330"/>
        <line x1="140" y1="0" x2="140" y2="165"/>
        <line x1="280" y1="0" x2="280" y2="330"/>
        <line x1="420" y1="0" x2="420" y2="330"/>
      </g>
      <!-- 梁符号 -->
      <g font-size="10" fill="#047857" font-weight="600">
        <text x="60" y="-6">G1</text><text x="200" y="-6">G1</text><text x="340" y="-6">G2</text>
        <text x="60" y="159">B1</text><text x="200" y="159">B1</text>
        <text x="60" y="324">G3</text><text x="340" y="324">G3</text>
      </g>

      <!-- 柱（検出: 青バウンディングボックス） -->
      <g>
        <g fill="#374151">
          <rect x="-7" y="-7" width="14" height="14"/>
          <rect x="133" y="-7" width="14" height="14"/>
          <rect x="273" y="-7" width="14" height="14"/>
          <rect x="413" y="-7" width="14" height="14"/>
          <rect x="-7" y="158" width="14" height="14"/>
          <rect x="133" y="158" width="14" height="14"/>
          <rect x="273" y="158" width="14" height="14"/>
          <rect x="-7" y="323" width="14" height="14"/>
          <rect x="273" y="323" width="14" height="14"/>
          <rect x="413" y="323" width="14" height="14"/>
        </g>
        <g fill="none" stroke="#2563eb" stroke-width="2">
          <rect x="-13" y="-13" width="26" height="26"/>
          <rect x="127" y="-13" width="26" height="26"/>
          <rect x="267" y="-13" width="26" height="26"/>
          <rect x="407" y="-13" width="26" height="26"/>
          <rect x="-13" y="152" width="26" height="26"/>
          <rect x="127" y="152" width="26" height="26"/>
          <rect x="267" y="152" width="26" height="26"/>
          <rect x="-13" y="317" width="26" height="26"/>
          <rect x="267" y="317" width="26" height="26"/>
          <rect x="407" y="317" width="26" height="26"/>
        </g>
        <g font-size="10" fill="#2563eb" font-weight="600">
          <text x="16" y="-16">C1</text><text x="156" y="-16">C1</text><text x="296" y="-16">C2</text><text x="436" y="-16">C2</text>
          <text x="16" y="150">C1</text><text x="156" y="150">C3</text><text x="296" y="150">C3</text>
          <text x="16" y="315">C1</text><text x="296" y="315">C2</text><text x="436" y="315">C2</text>
        </g>
      </g>
    </g>

    <!-- 凡例 -->
    <g transform="translate(60,440)" font-size="12" fill="#374151">
      <rect x="0" y="-10" width="14" height="14" fill="none" stroke="#2563eb" stroke-width="2"/>
      <text x="22" y="2">柱（bbox 検出）</text>
      <line x1="150" y1="-3" x2="185" y2="-3" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
      <text x="193" y="2">梁（line 検出）</text>
      <line x1="330" y1="-3" x2="365" y2="-3" stroke="#9ca3af" stroke-width="1" stroke-dasharray="6 4"/>
      <text x="373" y="2">通り芯</text>
    </g>
  </g>

  <!-- ============ 右パネル: 電気設備図面 ============ -->
  <g transform="translate(620,90)">
    <rect width="540" height="470" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <text x="270" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#374151">電気設備図面（架空） — シンボル読み出し</text>

    <g transform="translate(50,60)">
      <!-- 部屋の間仕切り -->
      <g fill="none" stroke="#4b5563" stroke-width="2">
        <rect x="0" y="0" width="440" height="340"/>
        <line x1="220" y1="0" x2="220" y2="200"/>
        <line x1="0" y1="200" x2="300" y2="200"/>
        <line x1="300" y1="200" x2="300" y2="340"/>
      </g>
      <!-- 建具（ドア開口） -->
      <g stroke="#4b5563" stroke-width="2" fill="none">
        <path d="M 120 200 A 40 40 0 0 1 160 240"/>
        <line x1="120" y1="200" x2="120" y2="240"/>
      </g>
      <g font-size="11" fill="#9ca3af">
        <text x="20" y="180">事務室A</text>
        <text x="250" y="180">事務室B</text>
        <text x="30" y="320">廊下</text>
        <text x="315" y="225">倉庫</text>
      </g>

      <!-- 配線 -->
      <g stroke="#6b7280" stroke-width="1.2" fill="none">
        <path d="M 110 100 C 160 60, 270 60, 330 100"/>
        <path d="M 110 100 C 110 160, 130 230, 150 260"/>
        <path d="M 330 100 C 360 160, 370 220, 375 270"/>
      </g>

      <!-- 照明シンボル（丸に斜線） -->
      <g stroke="#374151" stroke-width="1.6" fill="#ffffff">
        <circle cx="110" cy="100" r="13"/>
        <line x1="101" y1="91" x2="119" y2="109"/>
        <circle cx="330" cy="100" r="13"/>
        <line x1="321" y1="91" x2="339" y2="109"/>
      </g>
      <!-- コンセントシンボル（丸+2本線） -->
      <g stroke="#374151" stroke-width="1.6" fill="#ffffff">
        <circle cx="150" cy="260" r="11"/>
        <line x1="150" y1="249" x2="150" y2="238"/>
        <line x1="143" y1="243" x2="157" y2="243"/>
      </g>
      <!-- 分電盤シンボル（矩形に対角線） -->
      <g stroke="#374151" stroke-width="1.6" fill="#ffffff">
        <rect x="363" y="258" width="24" height="24"/>
        <line x1="363" y1="258" x2="387" y2="282"/>
      </g>
      <!-- スイッチシンボル（黒点+レバー） -->
      <g stroke="#374151" stroke-width="1.6">
        <circle cx="200" cy="220" r="4" fill="#374151"/>
        <line x1="200" y1="220" x2="212" y2="204"/>
      </g>

      <!-- 検出オーバーレイ（橙の破線円＋ラベル） -->
      <g fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 3">
        <circle cx="110" cy="100" r="21"/>
        <circle cx="330" cy="100" r="21"/>
        <circle cx="150" cy="260" r="19"/>
        <rect x="356" y="251" width="38" height="38" rx="4"/>
        <circle cx="203" cy="215" r="16"/>
      </g>
      <g font-size="10" font-weight="600" fill="#ea580c">
        <text x="134" y="86">照明 0.98</text>
        <text x="354" y="86">照明 0.97</text>
        <text x="172" y="266">ｺﾝｾﾝﾄ 0.95</text>
        <text x="332" y="246">分電盤 0.96</text>
        <text x="222" y="204">ｽｲｯﾁ 0.92</text>
      </g>
    </g>

    <!-- 凡例 -->
    <g transform="translate(50,440)" font-size="12" fill="#374151">
      <circle cx="7" cy="-4" r="8" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 3"/>
      <text x="22" y="0">検出シンボル（種別・スコア）</text>
      <line x1="230" y1="-4" x2="265" y2="-4" stroke="#6b7280" stroke-width="1.2"/>
      <text x="273" y="0">配線</text>
      <line x1="340" y1="-4" x2="375" y2="-4" stroke="#4b5563" stroke-width="2"/>
      <text x="383" y="0">間仕切り</text>
    </g>
  </g>

  <text x="600" y="620" text-anchor="middle" font-size="12" fill="#9ca3af">構造図・設備図ともに説明用の架空イメージ（実案件の図面・検出結果とは無関係）</text>
</svg>
